<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión | AMAC</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <a class="saltar-contenido" href="#principal">Saltar al contenido</a>

  <header class="encabezado contenedor">
    <p class="nombre-sitio">AMAC · Bolsa de trabajo</p>
    <nav aria-label="Navegación principal">
      <a href="index.html">Vacantes</a>
      <a href="mis-solicitudes.html">Mis solicitudes</a>
      <a href="login.html">Iniciar sesión</a>
      <a href="registro-candidato.html">Registro de candidato</a>
      <a href="empresa-vacantes.html">Panel de empresa</a>
    </nav>
    <a class="boton" href="#ayuda">Ayuda AMAC</a>
  </header>

  <main id="principal" class="contenedor" tabindex="-1">
    <h1>Inicio de sesión</h1>

    <form class="formulario">
      <div class="campo-formulario">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email" required>
      </div>
      <div class="campo-formulario">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
      </div>
      <button class="boton" type="button">Iniciar sesión</button>
    </form>
    <div class="acciones">
      <a class="boton" href="registro-candidato.html">Registrarme como candidato</a>
      <a class="boton" href="index.html">Volver al listado</a>
    </div>
  </main>

  <footer class="pie contenedor" id="ayuda">
    <h2>Ayuda AMAC</h2>
    <p>Solicita ayuda a AMAC por teléfono. Número pendiente de confirmar.</p>
  </footer>
</body>
</html>
