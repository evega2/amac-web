<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión | AMAC</title>
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <a class="saltar-contenido" href="#principal">Saltar al contenido</a>
  <header class="encabezado contenedor"><p class="nombre-sitio">AMAC · Bolsa de trabajo</p><nav aria-label="Navegación principal"><a href="index.html">Vacantes</a><a href="mis-solicitudes.html">Mis solicitudes</a><a href="login.html" aria-current="page">Iniciar sesión</a><a href="registro-candidato.html">Registro de candidato</a><a href="empresa-vacantes.html">Panel de empresa</a></nav><a class="boton" href="#ayuda">Ayuda AMAC</a></header>
  <main id="principal" class="contenedor" tabindex="-1">
    <section class="panel">
      <h1>Inicio de sesión</h1>
      <form class="formulario">
        <div><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" autocomplete="email" required></div>
        <div><label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required></div>
        <div class="acciones"><button class="boton" type="submit">Iniciar sesión</button><a class="boton" href="registro-candidato.html">Registrarme como candidato</a><a class="boton" href="registro-empresa.html">Registrar empresa</a><a class="boton boton-secundario" href="index.html">Volver al listado</a></div>
      </form>
    </section>
  </main>
  <footer class="pie contenedor" id="ayuda"><h2>Ayuda AMAC</h2><p>Comunícate al <strong>81 1234 5678</strong>.</p></footer>
</body>
</html>
