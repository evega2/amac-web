  <main id="principal" class="contenedor" tabindex="-1"><section class="panel"><h1>Registro de empresa</h1><form class="formulario"><div class="grupo-campos"><div><label for="empresa">Nombre de la empresa</label><input id="empresa" name="empresa" required></div><div><label for="giro">Giro</label><input id="giro" name="giro" required></div><div><label for="rfc">RFC</label><input id="rfc" name="rfc" required></div><div><label for="telefono">Teléfono de la empresa</label><input id="telefono" name="telefono" type="tel" required></div><div><label for="correo">Correo de la empresa</label><input id="correo" name="correo" type="email" required></div><div><label for="calle">Calle y número</label><input id="calle" name="calle" required></div><div><label for="colonia">Colonia</label><input id="colonia" name="colonia" required></div><div><label for="codigo-postal">Código postal</label><input id="codigo-postal" name="codigo-postal" inputmode="numeric" pattern="[0-9]{5}" required></div><div><label for="municipio">Municipio o ciudad</label><input id="municipio" name="municipio" required></div><div><label for="nombre-contacto">Nombre(s) de contacto</label><input id="nombre-contacto" name="nombre-contacto" required></div><div><label for="apellido-paterno">Apellido paterno de contacto</label><input id="apellido-paterno" name="apellido-paterno" required></div><div><label for="apellido-materno">Apellido materno de contacto</label><input id="apellido-materno" name="apellido-materno"></div><div><label for="telefono-contacto">Teléfono de contacto</label><input id="telefono-contacto" name="telefono-contacto" type="tel" required></div><div><label for="correo-contacto">Correo de contacto</label><input id="correo-contacto" name="correo-contacto" type="email" required></div><div><label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena" type="password" minlength="8" required></div></div><div class="acciones"><button class="boton" type="button">Adjuntar logo</button><button class="boton" type="button">Adjuntar banner</button></div><p class="texto-ayuda">El registro quedará pendiente de aprobación por AMAC.</p><button class="boton" type="submit">Registrar empresa</button><a class="boton boton-secundario" href="login.html">Volver</a></form></section></main>
